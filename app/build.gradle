plugins { id 'com.android.application' }

def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }
def tmdbKey = local.getProperty('TMDB_API_KEY', System.getenv('TMDB_API_KEY') ?: '')
def escapedKey = tmdbKey.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n').replace('\r', '\\r')

android {
    namespace 'vn.edu.usth.imdbclient'
    compileSdk { version = release(36) { minorApiLevel = 1 } }
    defaultConfig {
        applicationId 'vn.edu.usth.imdbclient'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'TMDB_API_KEY', '"' + escapedKey + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions { arguments += ['room.schemaLocation': "$projectDir/schemas".toString()] }
        }
    }
    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
